name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r rag_service/requirements.txt -r agent_service/requirements.txt
      - run: cd rag_service && python -m pytest -q
      - run: cd agent_service && python -m pytest -q
      - run: python eval/run_eval.py
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
